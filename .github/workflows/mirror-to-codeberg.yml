name: Espejo a Codeberg

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar historia completa
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar credenciales
        id: check
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "${CODEBERG_TOKEN}" ]; then
            echo "::warning::Falta el secreto CODEBERG_TOKEN. Creá un token de acceso en Codeberg (Settings > Applications, permiso write:repository) y guardalo en GitHub > Settings > Secrets and variables > Actions como CODEBERG_TOKEN. Espejo omitido."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # El push va SIN --force a propósito: si alguien mergeó algo en Codeberg
      # y las historias divergen, el workflow falla y avisa, en vez de borrar
      # el aporte de la comunidad en silencio. Ante un fallo, integrar primero
      # ese cambio en el upstream de GitHub y volver a correr el workflow.
      - name: Empujar a Codeberg
        if: steps.check.outputs.ok == 'true'
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_USER: ${{ vars.CODEBERG_USER || 'AgroEcoRed' }}
          CODEBERG_REPO: ${{ vars.CODEBERG_REPO || 'AgroEcoRed/agroeco-red' }}
        run: |
          REMOTE="https://${CODEBERG_USER}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_REPO}.git"
          if ! git ls-remote "$REMOTE" >/dev/null 2>&1; then
            echo "::error::No se pudo acceder a codeberg.org/${CODEBERG_REPO}. Verificá que el repositorio exista y que el token tenga permiso write:repository."
            exit 1
          fi
          git push "$REMOTE" HEAD:main
          git push --tags "$REMOTE"
